name: "Google Play: Update store listing"

# Pushes the store listing kept in fastlane/metadata/android to Google Play:
# title, short and full description, app icon, feature graphic and phone
# screenshots, through the Play Developer API (scripts/ci/play_listing.py).
# Edit those files in a PR, merge, then run this from the Actions tab. Release notes are not touched (the upload workflow writes
# them per release).
#
# Needs the PLAY_SERVICE_ACCOUNT_JSON secret (see docs/PLAY_STORE.md).

on:
  workflow_dispatch:
    inputs:
      images:
        description: Also upload the icon, feature graphic and screenshots
        type: boolean
        default: true

concurrency:
  group: play-store-upload
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the Play credentials
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::The PLAY_SERVICE_ACCOUNT_JSON secret is not set. See docs/PLAY_STORE.md."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Play API client
        run: pip install google-api-python-client google-auth

      - name: Upload the listing
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          IMAGES: ${{ inputs.images }}
        run: |
          if [ "$IMAGES" = "true" ]; then
            python3 scripts/ci/play_listing.py
          else
            python3 scripts/ci/play_listing.py --no-images
          fi
          echo "Store listing updated from fastlane/metadata/android." >> "$GITHUB_STEP_SUMMARY"
