name: "Google Play: Update store listing"

# Pushes the store listing kept in fastlane/metadata/android to Google Play:
# title, short and full description, app icon, feature graphic and phone
# screenshots. Edit those files in a PR, merge, then run this from the
# Actions tab. Release notes are not touched (the upload workflow writes
# them per release).
#
# Needs the PLAY_SERVICE_ACCOUNT_JSON secret (see docs/PLAY_STORE.md).

on:
  workflow_dispatch:
    inputs:
      images:
        description: Also upload the icon, feature graphic and screenshots
        type: boolean
        default: true
      track:
        description: A track that has the latest release on it (fastlane needs one to attach the edit to)
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

concurrency:
  group: play-store-upload
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the Play credentials
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::The PLAY_SERVICE_ACCOUNT_JSON secret is not set. See docs/PLAY_STORE.md."
            exit 1
          fi

      - name: Find the latest release's version code
        id: code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # fastlane supply refuses a listing-only upload unless it is given
          # the version code of a release on the track, so use the latest
          # GitHub release (vX.Y.Z -> X*1000000 + Y*1000 + Z).
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Latest release '$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Using $TAG (versionCode $CODE)"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Upload the listing
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SKIP_IMAGES: ${{ !inputs.images }}
          TRACK: ${{ inputs.track }}
          CODE: ${{ steps.code.outputs.version_code }}
        run: |
          fastlane supply \
            --package_name com.booruramen.app \
            --json_key_data "$PLAY_JSON" \
            --track "$TRACK" \
            --version_code "$CODE" \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_changelogs true \
            --skip_upload_images "$SKIP_IMAGES" \
            --skip_upload_screenshots "$SKIP_IMAGES" \
            --sync_image_upload true
          echo "Store listing updated from fastlane/metadata/android." >> "$GITHUB_STEP_SUMMARY"
