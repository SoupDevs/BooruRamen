name: "Release"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'package.json'
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT }}
          fetch-depth: 0

      - name: Automated Version Bump
        id: bump
        uses: phips28/gh-action-bump-version@master
        with:
          tag-prefix: 'v'
          # {{version}} already includes the tag prefix, so no literal "v" here
          commit-message: 'ci: version bump to {{version}} [skip ci]'
          # Bump type comes from the commit messages in the push, matched as
          # plain substrings against the wording lists below; anything else is
          # a patch. CAUTION: never spell a trigger word out in a commit
          # message when merely referring to it, or that push will bump at
          # that level. (A hardcoded version-type would override this
          # detection and force every release to be a patch.)
          major-wording: 'BREAKING CHANGE,[major]'
          minor-wording: 'feat:,feat(,[minor]'
          default: 'patch'
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_PAT }}

      - name: Sync Tauri Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          git config user.name "Automated Version Bump"
          git config user.email "gh-action-bump-version@users.noreply.github.com"
          git add src-tauri/tauri.conf.json
          git commit -m "ci: sync tauri version to $VERSION [skip ci]" || echo "No changes"
          git push origin master
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows App
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Find Windows Artifacts
        shell: bash
        run: |
          echo "Looking for Windows artifacts..."
          find src-tauri/target -name "*.msi" -o -name "*.exe" 2>/dev/null | head -20 || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-android:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/android-build.yaml
    with:
      ref: master
    secrets: inherit

  release:
    needs: [prepare, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/android

      - name: List all artifacts
        run: |
          echo "=== All artifacts ==="
          find artifacts -type f -ls

      - name: Rename APK with version
        run: |
          VERSION=${{ needs.prepare.outputs.new_version }}
          # Find and rename APK files to include version (universal build)
          find artifacts/android -name "*.apk" -exec sh -c 'mv "$1" "artifacts/android/BooruRamen_${VERSION}_universal.apk"' _ {} \; 2>/dev/null || true
        env:
          VERSION: ${{ needs.prepare.outputs.new_version }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.new_version }}
          name: BooruRamen v${{ needs.prepare.outputs.new_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/windows/**/*.msi
            artifacts/windows/**/*.exe
            artifacts/android/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
