[package]
name = "app"
version = "0.2.0-0"
description = "BooruRamen - A personalized booru browser"
authors = ["SoupDevs"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "booruramen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Used by the updater to fire the Android package-installer intent.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[features]
# Sideloaded self-updates: download the release APK and hand it to the system
# package installer. On by default because that is how release APKs update
# themselves today.
#
# A build whose updates are managed elsewhere (Google Play, F-Droid) removes
# "sideload-updates" from `default` below: the installer intent, the JNI
# dependency, and - via scripts/android/patch_android_project.mjs - the
# REQUEST_INSTALL_PACKAGES permission and the FileProvider all disappear from
# the build. The command keeps existing so the UI gets a clear message instead
# of an "unknown command" error.
default = ["sideload-updates"]
sideload-updates = ["dep:jni"]
